name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg + ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination .
          Copy-Item $ffprobeExe.FullName -Destination .

      - name: Build with PyInstaller
        run: >
          pyinstaller --name SilentCutter --onefile --windowed
          --add-data "silence_cutter/data;silence_cutter/data"
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          --collect-all customtkinter
          --collect-all tkinterdnd2
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          run_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentCutter-windows
          path: dist/SilentCutter.exe

      - name: Publish to "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest dist/SilentCutter.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create latest dist/SilentCutter.exe \
              --repo "${{ github.repository }}" \
              --title "SilentCutter (Windows)" \
              --notes "Готовая сборка для Windows, ffmpeg уже встроен. Скачайте SilentCutter.exe и запустите — больше ничего ставить не нужно."
          fi
